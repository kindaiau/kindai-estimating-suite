name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-current-tree:
    name: Scan tracked files without exposing values
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan tracked files
        run: python3 scripts/check-secrets.py
