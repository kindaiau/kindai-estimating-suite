name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response="$(gh api --include "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" 2>&1)"
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$response" | grep -qE '^HTTP/[0-9.]+ 404'; then
            echo "::warning::Dependency review skipped because the repository dependency graph is not enabled."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$response"
            echo "::error::Dependency graph availability check failed."
            exit 1
          fi

      - name: Dependency Review
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4.9.0

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
